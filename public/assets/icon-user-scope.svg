<!-- Bootstrap Icons person-fill.svg (MIT). Source confirmed by Tatyana 2026-09-22. -->
<!--
  The SCOPE-LIST variant. Identical path to /assets/icon-user.svg (the top-nav
  "Account" icon); the only difference is the fill, #5f6368 to match its sibling
  /assets/icon-mail.svg in this same list rather than #bfc4c8 for the dark nav.

  It was a blank placeholder rect until 2026-09-23. DEMO_AUDIT.md X-05: on NL-05
  that rect rendered as an EMPTY SQUARE directly above the real "I have read and
  accept" checkbox, so the consent list read as four unticked checkboxes and the
  presenter's single click on the real one looked arbitrary. Used twice
  (Figma 6098:34125 / 6098:34129).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#5f6368" viewBox="0 0 16 16" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
</svg>
