<svg xmlns="http://www.w3.org/2000/svg" width="345" height="345.63043212890625" viewBox="0 0 345 345.63043212890625" fill="none" role="img" aria-label="placeholder illustration, a person holding a phone at eye level to scan their face" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- PLACEHOLDER for Figma 6076:31212 `Screenshot_20260909_103940_Firefox 2`, the
       illustration inside `illustration-frame` (6056:13912) on CID_Biometric
       (6217:65268) — the "Prepare to scan your face" liveness screen.
       345 x 345.63043212890625, exact: this is the leaf's RENDERED size, which is
       what the page's `aspect-[361/361.65966796875]` box resolves to at 393.

       YOTI-OWNED ARTWORK. In Figma this is not a clean export either — it is a crop
       of ONE pasted screenshot, placed by negative offsets (left -8.14%, top
       -118.22%, 116.29% x 257.95%). The same situation as the three `Guidelines Card`
       icons on /cid/capture-intro/, which were likewise split into dimension-exact
       single-purpose files. Swapping in a real export is a byte replacement with no
       layout change — the page sizes the box from the aspect ratio, never from the
       file.

       Neutral line-art stand-in only. Nothing here is measured artwork; the colours
       are sampled from the Figma render (pale blue panel #e4eefb, #6cb0e4 top,
       #2b3a4a line). PAINT ORDER MATTERS: torso, then head, then the raised arm,
       then the phone, then the scan line — so the arm and phone sit in FRONT of the
       body, as they do in the Figma drawing, instead of behind it. -->
  <rect width="345" height="345.63043212890625" rx="16" fill="#e4eefb"/>
  <g stroke="#2b3a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- neck -->
    <path d="M178 140h34v34h-34z" fill="#f7fbff" stroke="none"/>
    <!-- torso and shoulders -->
    <path d="M195 158c-6 10-18 15-33 21c-19 8-30 21-33 44l-6 96h144l-6-96c-3-23-14-36-33-44c-15-6-27-11-33-21Z" fill="#6cb0e4"/>
    <!-- hair, back layer -->
    <path d="M152 112c0-32 19-52 43-52s43 20 43 52c0 20-4 36-9 44l-8-30c-14 6-38 7-52 2l-8 28c-5-8-9-24-9-44Z" fill="#f7fbff"/>
    <!-- face -->
    <path d="M164 104c0-22 14-36 31-36s31 14 31 36c0 25-14 43-31 43s-31-18-31-43Z" fill="#f7fbff"/>
    <!-- eyes and mouth -->
    <path d="M179 100h7M204 100h7"/>
    <path d="M188 120c4 4 10 4 14 0"/>
    <!-- phone, held up at face level (behind the hand) -->
    <rect x="74" y="140" width="40" height="72" rx="7" fill="#ffffff"/>
    <path d="M87 151h14"/>
    <!-- ONE continuous raised arm: shoulder -> elbow -> forearm -> hand.
         Drawn as a single silhouette rather than three pieces, so it reads as a
         limb instead of a scatter of blue patches. -->
    <path d="M170 184c-22 10-40 28-48 52c-5 15-4 27 2 34c5 6 13 7 19 2c5-5 5-13 2-20c-3-8-2-17 3-26c5-9 14-17 26-22Z" fill="#6cb0e4"/>
    <!-- hand gripping the phone -->
    <path d="M99 186c10 0 18 7 18 16c0 9-8 16-18 16c-10 0-18-7-18-16c0-9 8-16 18-16Z" fill="#6cb0e4"/>
    <!-- scan line, phone to face -->
    <path d="M120 168h36" stroke-dasharray="7 7"/>
  </g>
</svg>
