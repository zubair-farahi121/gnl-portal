# GNL demo — internal testing.
#
#   docker compose up --build -d     # build and start in the background
#   open http://localhost:4173/
#   docker compose down              # stop
#
# Optional settings (put them in front of the command, or in a .env file):
#   DEMO_PORT=8080          host port (default 4173). If you change it, also set
#                           PUBLIC_BASE_URL, or the QR codes still point to :4173.
#   PUBLIC_BASE_URL=http://192.168.1.20:4173
#                           the address a PHONE can reach (phone path). Read at
#                           RUN time — no rebuild needed. See DEPLOY.md "Phone path".
#   TLS_CERT=/certs/cert.pem TLS_KEY=/certs/key.pem
#                           HTTPS (phones only allow the camera on HTTPS). Put the
#                           two files in ./certs next to this file — it is mounted
#                           read-only at /certs. Then use https:// in PUBLIC_BASE_URL.
#   DEMO_SYNC=off           static files only, exactly like `npm run serve`.
#   NODE_IMAGE=<registry>/node:22-bookworm-slim
#                           only if your network blocks Docker Hub.
services:
  gnl-demo:
    build:
      context: .
      args:
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    image: gnl-demo:test
    container_name: gnl-demo
    ports:
      - "${DEMO_PORT:-4173}:4173"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
      DEMO_SYNC: ${DEMO_SYNC:-on}
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped
